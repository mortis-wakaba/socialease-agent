services:
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socialease}
      POSTGRES_USER: ${POSTGRES_USER:-socialease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialease}
    ports:
      - "5432:5432"
    volumes:
      - socialease-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      SOCIALEASE_DB_PATH: /data/socialease.db
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      SOCIALEASE_DATABASE_URL: ${SOCIALEASE_DATABASE_URL:-sqlite:////data/socialease.db}
      SOCIALEASE_CORS_ORIGINS: ${SOCIALEASE_CORS_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      SOCIALEASE_REDIS_URL: ${SOCIALEASE_DOCKER_REDIS_URL:-redis://redis:6379/0}
      ROLEPLAY_SESSION_CONTEXT_TTL_SECONDS: ${ROLEPLAY_SESSION_CONTEXT_TTL_SECONDS:-3600}
      ROLEPLAY_PAUSED_CONTEXT_TTL_SECONDS: ${ROLEPLAY_PAUSED_CONTEXT_TTL_SECONDS:-86400}
      ROLEPLAY_CONTEXT_MAX_INPUT_TOKENS: ${ROLEPLAY_CONTEXT_MAX_INPUT_TOKENS:-10000}
      ROLEPLAY_RECENT_MIN_MESSAGES: ${ROLEPLAY_RECENT_MIN_MESSAGES:-12}
      ROLEPLAY_RECENT_TARGET_MESSAGES: ${ROLEPLAY_RECENT_TARGET_MESSAGES:-16}
      ROLEPLAY_RECENT_MAX_MESSAGES: ${ROLEPLAY_RECENT_MAX_MESSAGES:-20}
      ROLEPLAY_COMPACT_TARGET_TOKENS: ${ROLEPLAY_COMPACT_TARGET_TOKENS:-1000}
      ROLEPLAY_COMPACT_TRIGGER_RATIO: ${ROLEPLAY_COMPACT_TRIGGER_RATIO:-0.75}
      WORKSHEET_DRAFT_TTL_SECONDS: ${WORKSHEET_DRAFT_TTL_SECONDS:-3600}
      SUPPORT_SEARCH_TTL_SECONDS: ${SUPPORT_SEARCH_TTL_SECONDS:-1800}
    ports:
      - "8000:8000"
    volumes:
      - socialease-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  socialease-data:
  socialease-postgres-data:

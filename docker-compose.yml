services:
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socialease}
      POSTGRES_USER: ${POSTGRES_USER:-socialease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialease}
    ports:
      - "5432:5432"
    volumes:
      - socialease-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_JSON_MODE_ENABLED: ${LLM_JSON_MODE_ENABLED:-true}
      SOCIALEASE_DATABASE_URL: ${SOCIALEASE_DATABASE_URL:-postgresql+psycopg://socialease:socialease@postgres:5432/socialease}
      SOCIALEASE_CORS_ORIGINS: ${SOCIALEASE_CORS_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      SOCIALEASE_REDIS_URL: ${SOCIALEASE_DOCKER_REDIS_URL:-redis://redis:6379/0}
      SOCIALEASE_REQUIRE_REDIS: ${SOCIALEASE_REQUIRE_REDIS:-false}
      SOCIALEASE_REDIS_SOCKET_TIMEOUT_SECONDS: ${SOCIALEASE_REDIS_SOCKET_TIMEOUT_SECONDS:-0.5}
      CONVERSATION_CONTEXT_CACHE_TTL_SECONDS: ${CONVERSATION_CONTEXT_CACHE_TTL_SECONDS:-3600}
      MODULE_OVERLAY_CACHE_TTL_SECONDS: ${MODULE_OVERLAY_CACHE_TTL_SECONDS:-3600}
      WORKSHEET_DRAFT_TTL_SECONDS: ${WORKSHEET_DRAFT_TTL_SECONDS:-3600}
      SUPPORT_SEARCH_TTL_SECONDS: ${SUPPORT_SEARCH_TTL_SECONDS:-1800}
      SOCIALEASE_MEMORY_RETRIEVAL_MODE: ${SOCIALEASE_MEMORY_RETRIEVAL_MODE:-dense_only}
      SOCIALEASE_MEMORY_VECTOR_MIN_SIMILARITY: ${SOCIALEASE_MEMORY_VECTOR_MIN_SIMILARITY:-0.45}
      SOCIALEASE_MEMORY_EMBEDDING_CACHE_DIR: ${SOCIALEASE_MEMORY_EMBEDDING_CACHE_DIR:-/data/model-cache}
      SOCIALEASE_MEMORY_EMBEDDING_MODEL_PATH: ${SOCIALEASE_MEMORY_EMBEDDING_MODEL_PATH:-}
      SOCIALEASE_MEMORY_EMBEDDING_LOCAL_ONLY: ${SOCIALEASE_MEMORY_EMBEDDING_LOCAL_ONLY:-false}
      SOCIALEASE_MEMORY_EMBEDDING_THREADS: ${SOCIALEASE_MEMORY_EMBEDDING_THREADS:-2}
      SOCIALEASE_MEMORY_EMBEDDING_CONCURRENCY: ${SOCIALEASE_MEMORY_EMBEDDING_CONCURRENCY:-2}
      SOCIALEASE_MEMORY_EMBEDDING_TIMEOUT_SECONDS: ${SOCIALEASE_MEMORY_EMBEDDING_TIMEOUT_SECONDS:-30}
      SOCIALEASE_MEMORY_EVIDENCE_SELECTOR_ENABLED: ${SOCIALEASE_MEMORY_EVIDENCE_SELECTOR_ENABLED:-true}
    ports:
      - "8000:8000"
    volumes:
      - socialease-model-cache:/data/model-cache
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  socialease-postgres-data:
  socialease-model-cache:

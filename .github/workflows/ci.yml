name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests and evals
    runs-on: ubuntu-latest
    env:
      SOCIALEASE_DATABASE_URL: postgresql+psycopg://socialease:socialease@127.0.0.1:5432/socialease
      SOCIALEASE_TEST_DATABASE_URL: postgresql+psycopg://socialease:socialease@127.0.0.1:5432/socialease
    services:
      postgres:
        image: postgres:16@sha256:fe03a7605299a34ddf5e4f285dff78c3d7190a576b3c6b46f2fcff69f4bffd54
        env:
          POSTGRES_USER: socialease
          POSTGRES_PASSWORD: socialease
          POSTGRES_DB: socialease
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialease -d socialease"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.lock

      - name: Check Prompt version governance
        working-directory: backend
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -m app.llm.prompt_version_check --base-ref "$BASE_REF"

      - name: Check repository privacy boundaries
        run: python scripts/check_repository_privacy.py

      - name: Validate PostgreSQL migrations
        working-directory: backend
        env:
          SOCIALEASE_DATABASE_URL: postgresql+psycopg://socialease:socialease@127.0.0.1:5432/socialease
        run: python -m app.db.migration_check

      - name: Run PostgreSQL integration tests
        working-directory: backend
        run: pytest -q tests/test_postgres_*.py tests/test_heavier_load.py::test_fresh_postgres_database_can_upgrade_to_head_when_configured

      - name: Run shared Redis task-state integration tests
        working-directory: backend
        env:
          SOCIALEASE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest -p no:rerunfailures -q -m redis_integration

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - name: Run eval suite
        working-directory: backend
        run: python -m app.evals.run

      - name: Enforce eval gates
        working-directory: backend
        run: python -m app.evals.gate

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Run production auth E2E
        working-directory: frontend
        run: npm run test:e2e:production-auth

  smoke:
    name: Real frontend/backend smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16@sha256:fe03a7605299a34ddf5e4f285dff78c3d7190a576b3c6b46f2fcff69f4bffd54
        env:
          POSTGRES_USER: socialease
          POSTGRES_PASSWORD: socialease
          POSTGRES_DB: socialease_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialease -d socialease_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      SOCIALEASE_DATABASE_URL: postgresql+psycopg://socialease:socialease@127.0.0.1:5432/socialease_smoke
      SOCIALEASE_REDIS_URL: redis://127.0.0.1:6379/0
      SOCIALEASE_REQUIRE_REDIS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run real smoke
        run: make e2e-smoke

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: real-smoke-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore

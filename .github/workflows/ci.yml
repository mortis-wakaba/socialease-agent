name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests and evals
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: socialease
          POSTGRES_PASSWORD: socialease
          POSTGRES_DB: socialease
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialease -d socialease"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Validate PostgreSQL migrations
        working-directory: backend
        env:
          SOCIALEASE_DATABASE_URL: postgresql+psycopg://socialease:socialease@127.0.0.1:5432/socialease
        run: python -m app.db.migration_check

      - name: Run PostgreSQL integration tests
        working-directory: backend
        env:
          SOCIALEASE_TEST_DATABASE_URL: postgresql+psycopg://socialease:socialease@127.0.0.1:5432/socialease
        run: |
          pytest \
            tests/test_postgres_protocol_repository.py \
            tests/test_postgres_protocol_service.py \
            tests/test_heavier_load.py::test_fresh_postgres_database_can_upgrade_to_head_when_configured

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - name: Run eval suite
        working-directory: backend
        run: python -m app.evals.run

      - name: Enforce eval gates
        working-directory: backend
        run: python -m app.evals.gate

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Run production auth E2E
        working-directory: frontend
        run: npm run test:e2e:production-auth

  smoke:
    name: Real frontend/backend smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run real smoke
        run: make e2e-smoke

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-smoke-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
